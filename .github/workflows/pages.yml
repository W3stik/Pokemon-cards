name: pages

on:
  push:
  pull_request:
  # Každý den ráno znovu nasadí aplikaci s čerstvými cenami karet.
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Nasazení na Pages běží vždy jen jedno, novější počká.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Ceny z TCGdex se přibalí k aplikaci. Karty, které se nepovede ocenit, doplní ceny
      # z posledního nasazení; když selže celé stahování, použije se celý minulý soubor.
      - name: Ceny karet
        env:
          PRICES_FALLBACK_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data/prices.json
        run: |
          npm run prices || curl -sfL "$PRICES_FALLBACK_URL" -o public/data/prices.json || echo "::warning::Ceny karet nejsou k dispozici"
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # Nasazení na GitHub Pages: z výchozí větve, denně (čerstvé ceny) nebo ručně.
  # V nastavení repozitáře musí být Settings → Pages → Source: GitHub Actions.
  deploy:
    needs: build
    if: github.ref_name == github.event.repository.default_branch && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
