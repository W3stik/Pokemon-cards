<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#11131a" />
    <meta name="description" content="Simulátor otevírání balíčků Pokémon TCG se skutečnými sadami, kartami a cenami." />
    <title>Booster Lab</title>
    <script>
      // Když se nenačte soubor aplikace (stará stránka po novém nasazení, soubory už na webu
      // nejsou), načte se stránka jednou znovu, místo aby zůstala prázdná.
      addEventListener(
        "error",
        function (e) {
          var t = e.target;
          if (!t || !(t.tagName === "SCRIPT" || (t.tagName === "LINK" && t.rel === "stylesheet"))) return;
          try {
            if (sessionStorage.getItem("booster-lab:reloaded")) return;
            sessionStorage.setItem("booster-lab:reloaded", "1");
          } catch (_) {}
          location.reload();
        },
        true,
      );
    </script>
    <link rel="manifest" href="./manifest.webmanifest" />
    <!-- Spojení se servery obrázků navážeme hned, ne až u prvního obrázku. -->
    <link rel="preconnect" href="https://assets.tcgdex.net" crossorigin />
    <link rel="preconnect" href="https://images.scrydex.com" crossorigin />
    <link rel="preconnect" href="https://tcgplayer-cdn.tcgplayer.com" crossorigin />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="#/shop">
        <img src="./icons/icon.svg" alt="" width="28" height="28" />
        <span>Booster Lab</span>
      </a>
    </header>
    <main id="view"></main>
    <nav class="tabbar" aria-label="Hlavní navigace">
      <a href="#/shop" data-route="shop"><span class="tabbar__icon">🛒</span><span class="tabbar__label">Obchod</span></a>
      <a href="#/open" data-route="open">
        <span class="tabbar__icon">🎁<span id="pack-badge" class="tabbar__badge hidden"></span></span><span class="tabbar__label">Balíčky</span>
      </a>
      <a href="#/album" data-route="album"><span class="tabbar__icon">📖</span><span class="tabbar__label">Album</span></a>
      <a href="#/more" data-route="more"><span class="tabbar__icon">⚙️</span><span class="tabbar__label">Více</span></a>
    </nav>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
